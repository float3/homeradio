name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            accept-flake-config = false
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix run nixpkgs#alejandra -- --check .

      - name: Check flake outputs
        run: nix flake check --print-build-logs

      # Start the packaged app and make sure it serves the dashboard, so a
      # missing template or dependency shows up here and not on the display.
      - name: Smoke test
        run: |
          set -euo pipefail
          nix build --print-build-logs
          export HOMERADIO_DATA_DIR="$RUNNER_TEMP/homeradio" HOMERADIO_HOST=127.0.0.1 HOMERADIO_PORT=5000
          ./result/bin/homeradio &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:5000/api/state && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:5000/ | grep -qi homeradio
